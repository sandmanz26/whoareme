<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>whoareyou — the directory for people who build tech</title>
    <meta
      name="description"
      content="A segmented portfolio directory for designers, engineers, product people and leaders in tech. Get found for the work you actually do."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are self-hosted (see src/fonts.css), so there is no third-party
         stylesheet to preconnect to. Preload only the two faces that render
         above the fold: the display weight in the hero and the body weight. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dm-sans-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#F5F4EF" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
